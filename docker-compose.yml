services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinelops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentinelops"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - sentinelops_postgres:/var/lib/postgresql/data

volumes:
  sentinelops_postgres:
