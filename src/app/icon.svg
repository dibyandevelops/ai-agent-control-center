<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090e" />
      <stop offset="100%" stop-color="#0f1722" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b7f34a" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#b7f34a" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Pill -->
  <rect width="32" height="32" rx="8" fill="url(#bg)" stroke="#1c2838" stroke-width="1" />

  <!-- Shield Shape -->
  <path
    d="M16 5.5 L24 9.5 V15.5 C24 20.8 20.5 25.2 16 26.5 C11.5 25.2 8 20.8 8 15.5 V9.5 Z"
    fill="none"
    stroke="url(#glow)"
    stroke-width="1.75"
    stroke-linejoin="round"
    filter="url(#shadow)"
  />

  <!-- Central Quantum Node / Core -->
  <circle cx="16" cy="15" r="2.5" fill="#b7f34a" />
  
  <!-- Quorum Intersect Lines -->
  <path d="M16 11.5 V12.5 M16 17.5 V18.5 M12.5 15 H13.5 M18.5 15 H19.5" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" />
</svg>
