<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 48" width="44" height="48" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090e" />
      <stop offset="100%" stop-color="#0f1722" />
    </linearGradient>
    <linearGradient id="s-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b7f34a" />
      <stop offset="60%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="stroke-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b7f34a" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#b7f34a" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Hexagonal Outer Frame -->
  <path
    d="M22 2.5 L41.5 12.5 V35.5 L22 45.5 L2.5 35.5 V12.5 Z"
    stroke="url(#stroke-grad)"
    stroke-width="3.2"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Isometric Ribbon "S" -->
  <path
    d="M12 17 L22 11 L32 17 L22 23 L32 29 L22 36 L12 30 L17 27 L22 30 L26 28 L12 20 V17 Z"
    fill="url(#s-grad)"
  />
</svg>
