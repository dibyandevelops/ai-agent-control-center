[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelops-ai"
version = "0.1.0"
description = "Python SDK for SentinelOps — human-in-the-loop governance for AI agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Orkestrate", email = "founders@orkestrate.ai" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
]
keywords = ["ai", "governance", "agents", "sentinelops", "compliance", "audit"]
dependencies = [
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "respx>=0.21",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://trysentinelops.com"
Documentation = "https://trysentinelops.com/docs"
Repository = "https://github.com/orkestrate/sentinelops-python"
Issues = "https://github.com/orkestrate/sentinelops-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["sentinelops"]
