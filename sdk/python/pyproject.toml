[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelops-ai"
version = "0.2.0"
description = "Python SDK for SentinelOps — human-in-the-loop governance for AI agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "SentinelOps", email = "iruka@sentinelops-ai.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
]
keywords = ["ai", "governance", "agents", "sentinelops", "langchain", "compliance", "audit"]
dependencies = [
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "respx>=0.21",
    "pytest-cov>=4.0",
]
langchain = [
    "langchain-core>=0.1",
]

[project.urls]
Homepage = "https://sentinelops-ai.com"
Documentation = "https://sentinelops-ai.com/docs/connecting-agents"
Repository = "https://github.com/dibyandevelops/ai-agent-control-center"
Issues = "https://github.com/dibyandevelops/ai-agent-control-center/issues"

[tool.hatch.build.targets.wheel]
packages = ["sentinelops"]
