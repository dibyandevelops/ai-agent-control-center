_metadata:
  major_version: 1
  minor_version: 1

display_information:
  name: SentinelOps Security Alerts
  description: High-priority AI governance, release, and integration security alerts from SentinelOps.
  background_color: "#0B1512"

features:
  bot_user:
    display_name: SentinelOps
    always_online: false

oauth_config:
  redirect_urls:
    - https://sentinelops-staging.vercel.app/api/v1/slack/connections/callback
  scopes:
    bot:
      - incoming-webhook

settings:
  incoming_webhooks:
    incoming_webhooks_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
