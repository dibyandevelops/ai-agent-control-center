name: Deploy staging

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Quality gate]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sentinelops-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    name: Verify and deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinelops_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentinelops_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sentinelops_ci
      DB_SSL: "false"
      DB_SSL_REJECT_UNAUTHORIZED: "false"
      DB_POOL_MAX: "5"
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: "1"
      STAGING_BASE_URL: https://ai-agent-control-center-alpha.vercel.app
      DEPLOYED_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOYED_COMMIT }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10.23.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run isolated enterprise journey
        if: github.event_name == 'workflow_dispatch'
        run: pnpm test:e2e

      - name: Pull staging project configuration
        run: >-
          pnpm dlx vercel@58.5.1 pull
          --yes
          --environment=production
          --token="$VERCEL_TOKEN"

      - name: Build staging artifact
        run: >-
          pnpm dlx vercel@58.5.1 build
          --prod
          --token="$VERCEL_TOKEN"

      - name: Deploy tested artifact
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          git_metadata_dir="$RUNNER_TEMP/sentinelops-git-metadata"
          mv .git "$git_metadata_dir"
          trap 'mv "$git_metadata_dir" .git' EXIT
          deployment_url="$(pnpm dlx vercel@58.5.1 deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tail -n 1)"
          echo "url=${deployment_url}" >> "$GITHUB_OUTPUT"

      - name: Verify deployed health
        run: >-
          curl
          --fail
          --retry 10
          --retry-delay 3
          "$STAGING_BASE_URL/api/health"

      - name: Run live staging approval journey
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DB_SSL: "true"
          DB_SSL_REJECT_UNAUTHORIZED: "true"
          SENTINELOPS_E2E_BASE_URL: ${{ env.STAGING_BASE_URL }}
          SENTINELOPS_E2E_EXPECT_DRY_RUN: "true"
        run: pnpm test:e2e:staging

      - name: Publish deployment summary
        run: |
          echo "## SentinelOps staging" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $STAGING_BASE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment artifact: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $DEPLOYED_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health check: passed" >> "$GITHUB_STEP_SUMMARY"
