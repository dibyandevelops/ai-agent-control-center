name: Publish SDKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (compile and verify packages without publishing)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # required for npm provenance and PyPI trusted publishing

concurrency:
  group: publish-sdks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-npm:
    name: Publish TypeScript SDK to npm (@sentinelops/sdk)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10.23.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Run SDK Tests
        run: pnpm test

      - name: Build TypeScript SDK
        run: pnpm exec tsc -p sdk/typescript/tsconfig.json

      - name: Pack package verification
        run: |
          cd sdk/typescript
          npm pack --dry-run

      - name: Publish to npm
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: |
          cd sdk/typescript
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish Python SDK to PyPI (sentinelops-ai)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine hatchling pytest respx httpx

      - name: Run Python SDK Tests
        run: |
          cd sdk/python
          pytest tests

      - name: Build sdist and wheel
        run: |
          cd sdk/python
          python -m build

      - name: Verify package distributions
        run: |
          cd sdk/python
          twine check dist/*

      - name: Publish to PyPI
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
